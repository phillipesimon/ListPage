<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Lista Pizzaria Pro</title>
    <meta name="theme-color" content="#d35400" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="container">
      <h1>🍕 Lista da Pizzaria</h1>
      <div id="categorias-container"></div>

      <div class="output">
        <h3>👀 Conferência da Lista:</h3>
        <div id="lista-texto">Nenhum item selecionado.</div>
      </div>

      <div class="btn-group">
        <button class="btn-main clear-btn" onclick="openModal()">Zerar</button>
        <button class="btn-main send-btn" onclick="shareList()">
          Enviar Lista
        </button>
      </div>
    </div>

    <div id="toast"></div>

    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-content">
        <h3>Zerar Lista?</h3>
        <p>Isso apagará todas as quantidades selecionadas.</p>
        <div class="modal-buttons">
          <button onclick="closeModal()" class="btn-modal-cancel">
            Cancelar
          </button>
          <button onclick="confirmClear()" class="btn-modal-confirm">
            Sim, Zerar
          </button>
        </div>
      </div>
    </div>

    <script src="produtos.js"></script>
    <script src="script.js"></script>
  </body>
</html>
