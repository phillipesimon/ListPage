<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Lista Pizzaria Pro</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#d35400" />

    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="container">
      <h1>🍕 Lista da Pizzaria</h1>
      <div id="categorias-container"></div>
      <div class="output">
        <h3>👀 Conferência da Lista:</h3>
        <div id="lista-texto">Nenhum item selecionado.</div>
      </div>
      <div class="btn-group">
        <button class="btn-main clear-btn" onclick="clearAll()">Zerar</button>
        <button class="btn-main send-btn" onclick="shareList()">
          Enviar Lista
        </button>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="produtos.js"></script>
  </body>
</html>
