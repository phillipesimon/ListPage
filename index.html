<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Lista Pizzaria Pro</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#d35400" />
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --primary: #d35400;
        --secondary: #27ae60;
        --danger: #e74c3c;
        --bg: #f9f3e1;
        --white: #ffffff;
        --selected-bg: #fff3e0; /* Tom de laranja suave para o fundo */
      }
      body {
        font-family: "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 100%;
        max-width: 550px;
        background: var(--white);
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 120px;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        color: var(--primary);
        font-size: 1.6em;
        margin-bottom: 15px;
      }
      .section {
        margin-top: 15px;
        border: 2px solid var(--primary);
        border-radius: 10px;
        overflow: hidden;
      }
      .section h2 {
        background: var(--primary);
        color: white;
        margin: 0;
        padding: 10px;
        font-size: 1em;
        text-transform: uppercase;
        text-align: center;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #eee;
        transition: background-color 0.3s ease; /* Transição suave da cor */
      }
      /* ESTILO PARA ITEM SELECIONADO */
      .item.selected {
        background-color: var(--selected-bg);
        border-left: 5px solid var(--primary);
      }
      .item.selected label {
        font-weight: bold;
        color: var(--primary);
      }

      .item label {
        font-size: 1em;
        color: #333;
        flex: 1;
        font-weight: 500;
      }
      .qty-controls {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .btn-qty {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 8px;
        font-size: 1.5em;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-minus {
        background: #eee;
        color: #555;
      }
      .btn-plus {
        background: var(--primary);
        color: white;
      }

      .item input {
        width: 45px;
        height: 38px;
        border: 1px solid #ddd;
        border-radius: 5px;
        text-align: center;
        font-size: 1.1em;
        font-weight: bold;
        outline: none;
        background: #fff;
      }
      .output {
        margin-top: 20px;
        padding: 12px;
        background: #fffdf9;
        border: 2px dashed var(--primary);
        border-radius: 8px;
      }
      .output h3 {
        margin: 0 0 10px 0;
        font-size: 1.1em;
        color: var(--primary);
        text-align: center;
      }
      #lista-texto {
        white-space: pre-line;
        font-weight: bold;
        color: #2c3e50;
        font-size: 1em;
      }
      .btn-group {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 15px;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        gap: 10px;
        box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.08);
        z-index: 100;
      }
      @media (min-width: 600px) {
        .btn-group {
          position: relative;
          padding: 20px 0;
          box-shadow: none;
          background: none;
        }
        .container {
          margin-bottom: 20px;
        }
      }
      .btn-main {
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        padding: 15px;
        text-transform: uppercase;
      }
      .copy-btn {
        flex: 2;
        background: var(--secondary);
        color: white;
        font-size: 1em;
      }
      .clear-btn {
        flex: 1;
        background: var(--danger);
        color: white;
        font-size: 0.8em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🍕 Lista da Pizzaria</h1>
      <div id="categorias-container"></div>
      <div class="output">
        <h3>👀 Conferência da Lista:</h3>
        <div id="lista-texto">Nenhum item selecionado.</div>
      </div>
      <div class="btn-group">
        <button class="btn-main clear-btn" onclick="clearAll()">Zerar</button>
        <button class="btn-main copy-btn" onclick="copyToClipboard()">
          Copiar Lista
        </button>
      </div>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js")
          .then(() => console.log("Sistema Offline Pronto!"))
          .catch((err) => console.log("Erro no Offline:", err));
      }
      const categorias = {
        Cozinha: [
          "Frango",
          "Carne",
          "Filé",
          "Camarão",
          "Coracao de Frango",
          "Piracuí",
          "Pirarucu",
          "Jambú",
          "Tucupi",
          "Manjericão",
          "Cheiro Verde",
          "Óleo",
          "Leite Caixa",
          "Batata Palha",
          "Macaxeira Chips",
          "Orégano",
          "Gás",
          "Alho",
          "Tempero Arisco",
          "Vinagre",
          "Sal",
          "Café",
          "Açúcar",
          "Sazón",
          "Saco Molho Verde",
          "Caldo Carne",
          "Caldo Frango",
          "Coloral",
          "Pimenta Reino",
          "Pimenta Cheiro",
          "Isqueiro",
        ],
        Limpeza: [
          "Detergente",
          "Desinfetante",
          "Sabão Pó",
          "Sabão Barra",
          "Veja",
          "Esponja",
          "Bombril",
          "Palha de Aço",
          "Água Sanitária",
          "Limpa Alumínio",
        ],
        Mesa: [
          "Cebola",
          "Tomate",
          "Pimentão",
          "Calabresa",
          "Presunto",
          "Bacon",
          "Milho",
          "Ervilha",
          "Azeitona",
          "Molho Vermelho",
          "Ovos",
          "Catupiry",
          "Cheddar",
          "Queijo Parmesão",
          "Queijo Qualho",
          "Queijo Provolone",
          "Queijo Prato",
          "Maionese Grande",
          "Salame",
          "Lombo Canadense",
          "Palmito",
          "Creme de Leite",
          "Leite Condensado",
          "Goiabada",
          "Chocolate",
          "Chocolate Granulado",
          "MMs",
          "Cupuaçu",
          "Banana",
          "Abacaxi",
          "Pessego",
          "Cereja",
          "Ameixa Seca",
          "Barbecue",
          "Azeite Camarão",
          "Pimenta Gota",
        ],
        "Massas e Caixas": [
          "Massa Media",
          "Massa Grande",
          "Massa Familia",
          "Massa Gigante",
          "Caixa Media",
          "Caixa Grande",
          "Caixa Familia",
          "Caixa Gigante",
        ],
        Balcão: [
          "Ketchup Sachê",
          "Maionese Sachê",
          "Saco Sache",
          "Saco Plastico",
          "Copo Descartável",
          "Prato Descartável",
          "Guardanapos",
          "Talher Descartável",
          "Fita Adesiva",
          "Bobinha Comanda",
          "Coca 1L",
          "Coca 1.5L",
          "Coca 2L",
          "Coca 2.5L",
          "Fanta 1L",
          "Fanta 1.5L",
          "Fanta 2L",
          "Baré 1L",
          "Baré 1.5L",
          "Baré 2L",
          "Guaraná 1L",
          "Guaraná 1.5L",
          "Guaraná 2L",
        ],
      };

      function init() {
        const container = document.getElementById("categorias-container");
        for (let titulo in categorias) {
          const section = document.createElement("div");
          section.className = "section";
          section.innerHTML = `<h2>${titulo}</h2>`;
          const list = document.createElement("div");
          categorias[titulo].forEach((nome) => {
            const id = "prod-" + nome.replace(/\s+/g, "-").toLowerCase();
            const savedVal = localStorage.getItem(id) || 0;
            const itemDiv = document.createElement("div");
            itemDiv.className = "item";
            // Adiciona classe de seleção se o valor salvo for > 0
            if (savedVal > 0) itemDiv.classList.add("selected");

            itemDiv.innerHTML = `
                        <label>${nome}</label>
                        <div class="qty-controls">
                            <button class="btn-qty btn-minus" onclick="changeQty('${id}', -1)">-</button>
                            <input type="number" id="${id}" value="${savedVal}" readonly>
                            <button class="btn-qty btn-plus" onclick="changeQty('${id}', 1)">+</button>
                        </div>`;
            list.appendChild(itemDiv);
          });
          section.appendChild(list);
          container.appendChild(section);
        }
        updatePreview();
      }

      function changeQty(id, delta) {
        const input = document.getElementById(id);
        const itemDiv = input.closest(".item");
        let newVal = parseInt(input.value || 0) + delta;
        if (newVal < 0) newVal = 0;

        input.value = newVal;
        localStorage.setItem(id, newVal);

        // Lógica de destaque visual
        if (newVal > 0) {
          itemDiv.classList.add("selected");
        } else {
          itemDiv.classList.remove("selected");
        }

        updatePreview();
      }

      function gerarTextoLista() {
        let itensCozinha = "";
        let itensBalcao = "";
        let itensMassas = "";

        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach((input) => {
          if (input.value > 0) {
            const label =
              input.parentElement.parentElement.querySelector(
                "label",
              ).innerText;
            const categoriaPai = input
              .closest(".section")
              .querySelector("h2").innerText;
            const linha = `• ${label}: ${input.value}\n`;

            if (
              ["COZINHA", "MESA", "LIMPEZA"].includes(
                categoriaPai.toUpperCase(),
              )
            ) {
              itensCozinha += linha;
            } else if (categoriaPai.toUpperCase() === "BALCÃO") {
              itensBalcao += linha;
            } else if (categoriaPai.toUpperCase() === "MASSAS E CAIXAS") {
              itensMassas += linha;
            }
          }
        });

        if (!itensCozinha && !itensBalcao && !itensMassas) return "";

        let texto = "";
        if (itensCozinha) texto += "*COZINHA*\n" + itensCozinha + "\n";
        if (itensBalcao) texto += "*BALCÃO*\n" + itensBalcao + "\n";
        if (itensMassas) texto += "*MASSAS E CAIXAS*\n" + itensMassas;

        return texto.trim();
      }

      function updatePreview() {
        const texto = gerarTextoLista();
        document.getElementById("lista-texto").innerText =
          texto || "Nenhum item selecionado.";
      }

      function copyToClipboard() {
        const conteudo = gerarTextoLista();
        if (!conteudo) return alert("Lista vazia!");
        const textoCompleto = "🛒 *LISTA DE COMPRAS*\n\n" + conteudo;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(textoCompleto)
            .then(() => alert("✅ Copiado!"));
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = textoCompleto;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand("copy");
          document.body.removeChild(textArea);
          alert("✅ Copiado!");
        }
      }

      function clearAll() {
        if (confirm("Zerar lista?")) {
          localStorage.clear();
          location.reload();
        }
      }
      init();
    </script>
  </body>
</html>
